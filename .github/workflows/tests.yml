name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that the promise "works on Discourse latest" is checked without a pull
  # request (the discourse job runs against core's latest). GitHub starts scheduled runs
  # from the default branch only; a failing one shows as a red run, with no retry.
  schedule:
    - cron: "41 3 * * 2" # Tuesdays, 03:41 UTC

permissions:
  contents: read

jobs:
  # The specs that need no Discourse: the signature on the gateway's vector, the payload
  # reader, the request and its answers, the text and its masks, every publish/hold
  # decision, the Claude Code rules, the locales, and the wire code against the mock
  # gateway of client-php over real HTTP. A skip here is a failure, twice over: the mock
  # spec raises without the mock (MINOS_REQUIRE_MOCK_GATEWAY), and the last step fails on
  # any pending example and unless every mock-gateway example passed.
  standalone:
    name: standalone (rspec, no Discourse)
    runs-on: ubuntu-latest
    env:
      MINOS_CLIENT_PHP: ${{ github.workspace }}/tmp/client-php
      MINOS_REQUIRE_MOCK_GATEWAY: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Check out client-php (the mock gateway), pinned
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
          repository: minos-moderation/client-php
          # client-php's main at e5df7d6 (v0.2.0): the mock (its masks keep the sent text's
          # length since f85c6ed) and docs/plugin-behaviour.md, the shared plugin rules the
          # compliance table of docs/development.md is checked against.
          ref: e5df7d6da76e4327838202f9325c5da8455820b9
          path: tmp/client-php
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: PHP with ext-curl for the mock gateway
        run: |
          php --version
          php -m | grep -qix curl
      - name: Install client-php (no dev dependencies)
        working-directory: tmp/client-php
        run: composer install --no-dev --no-interaction --no-progress
      - name: Specs
        run: >-
          bundle exec rspec spec/lib spec/repo
          --format progress --format json --out tmp/rspec-report.json
      - name: Every example ran, the mock gateway's included
        run: |
          ruby - <<'RUBY'
          require "json"
          report = JSON.parse(File.read("tmp/rspec-report.json"))
          summary = report.fetch("summary")
          puts report.fetch("summary_line")
          mock = report.fetch("examples").select { |e| e["file_path"].include?("mock_gateway_spec") }
          abort "pending examples: #{summary["pending_count"]}" unless summary["pending_count"].zero?
          abort "no mock gateway example ran" if mock.empty?
          failed = mock.reject { |e| e["status"] == "passed" }
          abort "mock gateway examples not passed: #{failed.size}" unless failed.empty?
          puts "mock gateway examples passed: #{mock.size}"
          RUBY

  # The specs that need Discourse (spec/requests, spec/jobs, spec/integration), run by
  # Discourse's own plugin workflow against core's `latest`. Its linting job is skipped:
  # the plugin's Gemfile carries rspec alone, without rubocop-discourse. The workflow is
  # pinned to the commit its moving tag v1 named on 2026-10-28.
  discourse:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@83e5990bc53a4e0eddabda672558e29382072bd6  # v1
    with:
      name: minos-moderation
      skip_linting: true

  # The release workflow's check on every pull request, against the version plugin.rb
  # declares (its last "# version:" line, as Discourse reads it), so a broken check shows
  # before tag time.
  release-version:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: plugin.rb's version passes the release check
        shell: bash
        run: |
          version="$(sed -n 's/^#[[:space:]]*version:[[:space:]]*//p' plugin.rb | tail -n 1)"
          bash .github/scripts/check-release-version.sh "v$version"

  # The workflows, with actionlint (which also runs the runner's shellcheck on every `run:`
  # script), and the scripts they call, with shellcheck. actionlint is a pinned release,
  # checked against its published SHA-256 before it runs.
  workflow-lint:
    name: actionlint and shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$url"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck on .github/scripts
        run: shellcheck .github/scripts/*.sh
